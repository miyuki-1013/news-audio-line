name: Daily News Audio to LINE

on:
  schedule:
    - cron: "0 23 * * *" # 23:00 UTC = 8:00 JST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  news-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate news script and audio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py generate

      - name: Commit and push audio file
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/latest.mp3
          git commit -m "Update daily news audio ($(date -u +'%Y-%m-%d'))" || echo "no changes to commit"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Wait for jsDelivr to serve the new file
        run: |
          URL="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ steps.commit.outputs.sha }}/audio/latest.mp3"
          EXPECTED_SIZE=$(stat -c%s audio/latest.mp3)
          for i in $(seq 1 20); do
            ACTUAL_SIZE=$(curl -sI "$URL" | tr -d '\r' | awk -F': ' 'tolower($1)=="content-length"{print $2}')
            if [ "$ACTUAL_SIZE" = "$EXPECTED_SIZE" ]; then
              echo "jsDelivrでの配信を確認しました (${ACTUAL_SIZE} bytes, ${i}回目で成功)"
              exit 0
            fi
            echo "まだ配信されていません (${i}回目, 取得サイズ: ${ACTUAL_SIZE:-なし} / 期待値: ${EXPECTED_SIZE}) — 5秒待機します"
            sleep 5
          done
          echo "::error::jsDelivrでの配信確認がタイムアウトしました"
          exit 1

      - name: Send audio message via LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python main.py send --url "https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ steps.commit.outputs.sha }}/audio/latest.mp3"
