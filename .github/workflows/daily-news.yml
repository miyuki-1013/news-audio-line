name: Daily News Audio to LINE

on:
  schedule:
    - cron: "0 23 * * *" # 23:00 UTC = 8:00 JST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  news-audio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate news script and audio
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python main.py generate

      - name: Commit and push audio file
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/latest.mp3
          git commit -m "Update daily news audio ($(date -u +'%Y-%m-%d'))" || echo "no changes to commit"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Send audio message via LINE
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          python main.py send --url "https://cdn.jsdelivr.net/gh/${{ github.repository }}@${{ steps.commit.outputs.sha }}/audio/latest.mp3"
